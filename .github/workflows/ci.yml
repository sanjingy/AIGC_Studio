name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aigc
          POSTGRES_PASSWORD: aigc_dev_password
          POSTGRES_DB: aigc_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aigc" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20

    env:
      ENV: test
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck (mypy)
        run: mypy apps worker packages

      - name: Migrations up & down
        # 只 upgrade 不验证 downgrade，等于没测回滚（09_Database.md 第 14 节）
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest --cov=apps --cov=worker --cov-report=term-missing

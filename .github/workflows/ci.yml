name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aigc
          POSTGRES_PASSWORD: aigc_dev_password
          POSTGRES_DB: aigc_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aigc" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20

    env:
      ENV: test
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck (mypy)
        run: mypy apps worker packages agents adapters skills

      - name: Migrations up & down
        # 只 upgrade 不验证 downgrade，等于没测回滚（09_Database.md 第 14 节）
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest --cov=apps --cov=worker --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # 前端地板只有类型和构建两项：ESLint 9 的扁平配置还没写完
      # （`npm run lint` 在本仓跑不出可信结果），加进来只会把红叉常态化。
      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Build (next build)
        run: npm run build
